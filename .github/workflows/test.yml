# Lint + the full test suite. Reused by CI, Release and KB refresh, so no pipeline can skip it.
name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  per-os:
    # both shipped platforms: tests/test_bidi.py measures real glyph positions from each OS's Qt
    name: Lint & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # uv installs the same wheels into the same interpreter as pip, several times faster
      - uses: astral-sh/setup-uv@v10.2.0   # this action publishes exact tags only, no floating v10
        with:
          enable-cache: true
          cache-dependency-glob: requirements*.txt

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check . --output-format=github

      - name: Test
        run: python -m pytest --junitxml=test-results.xml -o junit_family=xunit2

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results.xml
          retention-days: 14

  # the check name branch protection requires ("test / Lint & test"): green only when every OS is green
  all:
    name: Lint & test
    needs: per-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every OS passed
        run: |
          echo "per-OS result: ${{ needs.per-os.result }}"
          [ "${{ needs.per-os.result }}" = success ]
